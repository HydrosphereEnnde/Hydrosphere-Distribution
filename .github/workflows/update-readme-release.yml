# Actualiza el README público de descarga tras publicar una release estable.
#
# Disparo: release publicada (no hay workflow canónico de publicación en este
# repositorio; las releases las crea tools.distribution.publish del repo
# privado Hydrosphere). workflow_dispatch permite reintentar sin republicar.
#
# No se ejecuta en push/PR. Un commit del README no publica releases ni
# vuelve a disparar este workflow.
#
# Permisos mínimos:
# - contents: write — leer el repo y, si el bloque cambió, hacer commit del README.
# No se crean tags, no se suben assets y no se modifican releases.

name: update-readme-release

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release estable (vacío = última estable no prerelease)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-readme-release
  cancel-in-progress: false

jobs:
  update-readme:
    name: Actualizar bloque de descarga del README
    runs-on: ubuntu-latest
    # Defensa extra: GitHub no dispara "published" para drafts; sí para prereleases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/readme-release"
          if [ "${EVENT_NAME}" = "release" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              > "${RUNNER_TEMP}/readme-release/release.json"
          elif [ -n "${INPUT_TAG}" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${INPUT_TAG}" \
              > "${RUNNER_TEMP}/readme-release/release.json"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '[.[] | select(.draft==false and .prerelease==false)][0]' \
              > "${RUNNER_TEMP}/readme-release/release.json"
          fi
          python - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "readme-release" / "release.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, dict) or not data.get("tag_name"):
              print("ERROR: no hay una release estable publicada para actualizar el README.", file=sys.stderr)
              sys.exit(1)
          print(f"Release {data.get('tag_name')} (id={data.get('id')})")
          PY

      - name: Fetch signed manifest if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "readme-release"
          release = json.loads((tmp / "release.json").read_text(encoding="utf-8"))
          matches = [
              a for a in release.get("assets") or []
              if isinstance(a, dict) and a.get("name") == "hydrosphere-update-manifest-v1.json"
          ]
          dest = tmp / "manifest.json"
          if not matches:
              print("Manifiesto no presente; se usará el digest del asset si existe.")
              sys.exit(0)
          if len(matches) != 1:
              print("ERROR: manifiesto de actualización ambiguo.", file=sys.stderr)
              sys.exit(1)
          asset_id = matches[0]["id"]
          dest.write_bytes(
              subprocess.check_output(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/octet-stream",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset_id}",
                  ]
              )
          )
          print(f"Manifiesto descargado ({dest.stat().st_size} bytes)")
          PY

      - name: Update README download block
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/readme-release"
          extra=()
          if [ -f "${tmp}/manifest.json" ]; then
            extra+=(--manifest-json "${tmp}/manifest.json")
          fi
          set +e
          python scripts/update_readme_release.py \
            --readme README.md \
            --release-json "${tmp}/release.json" \
            --meta-out "${tmp}/meta.json" \
            "${extra[@]}"
          code=$?
          set -e
          if [ "${code}" -eq 2 ]; then
            echo "Release draft/prerelease: README no modificado."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${code}" -ne 0 ]; then
            exit "${code}"
          fi
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json, os, pathlib
          meta = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "readme-release" / "meta.json").read_text(encoding="utf-8"))
          print(f"changed={'true' if meta.get('changed') else 'false'}")
          print("skipped=false")
          print(f"tag_name={meta.get('tag_name', '')}")
          PY

      - name: Commit README if changed
        if: steps.generate.outputs.changed == 'true'
        env:
          TAG_NAME: ${{ steps.generate.outputs.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
            exit 0
          fi
          git commit -m "docs(distribution): actualizar descarga a ${TAG_NAME}"
          git push
