<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydrosphere</title>
  <meta name="description" content="Descarga Hydrosphere: software profesional para inspecciones de tuberías." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #071820;
      --foam: #e8f4f2;
      --teal: #0a6b63;
      --teal-bright: #12a89a;
      --sand: #c4a574;
      --muted: rgba(232, 244, 242, 0.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Figtree", system-ui, sans-serif;
      color: var(--foam);
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(18, 168, 154, 0.35), transparent 55%),
        radial-gradient(900px 600px at 100% 20%, rgba(196, 165, 116, 0.18), transparent 50%),
        linear-gradient(165deg, #031016 0%, #0a2a32 42%, #061820 100%);
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      align-content: center;
      padding: clamp(2rem, 6vw, 4.5rem);
      max-width: 52rem;
    }

    .brand {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(2.75rem, 9vw, 4.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 0.95;
      margin: 0 0 1rem;
      opacity: 0;
      animation: rise 0.9s ease-out 0.05s forwards;
    }

    .lead {
      margin: 0 0 2.25rem;
      max-width: 28rem;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      font-weight: 500;
      line-height: 1.45;
      color: var(--muted);
      opacity: 0;
      animation: rise 0.9s ease-out 0.2s forwards;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1rem;
      opacity: 0;
      animation: rise 0.9s ease-out 0.35s forwards;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 0.35rem;
      padding: 0.9rem 1.35rem;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--teal-bright);
      color: var(--ink);
    }

    .btn-primary:hover { background: #3bc4b6; }

    .btn-ghost {
      background: transparent;
      color: var(--foam);
      box-shadow: inset 0 0 0 1.5px rgba(232, 244, 242, 0.35);
      cursor: default;
      opacity: 0.7;
    }

    .btn-ghost[aria-disabled="true"] {
      pointer-events: none;
    }

    .note {
      margin: 1.75rem 0 0;
      font-size: 0.9rem;
      color: rgba(232, 244, 242, 0.55);
      opacity: 0;
      animation: rise 0.9s ease-out 0.5s forwards;
    }

    .note a {
      color: var(--sand);
      text-decoration: none;
      border-bottom: 1px solid rgba(196, 165, 116, 0.45);
    }

    .note a:hover { border-bottom-color: var(--sand); }

    .ripple {
      position: fixed;
      inset: auto -20% -35% 35%;
      height: 55vh;
      background:
        radial-gradient(ellipse at center, rgba(10, 107, 99, 0.45), transparent 65%);
      filter: blur(8px);
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(-4%, -3%, 0) scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand, .lead, .actions, .note, .ripple { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="ripple" aria-hidden="true"></div>
  <main class="hero">
    <h1 class="brand">Hydrosphere</h1>
    <p class="lead">
      Software profesional para preparar, analizar y documentar inspecciones de tuberías.
    </p>
    <div class="actions">
      <a
        class="btn btn-primary"
        href="https://github.com/HydrosphereEnnde/Hydrosphere-Distribution/releases/download/v0.0.9/Hydrosphere-0.0.9-win-x86_64-per-user.exe"
      >
        Descargar para Windows
      </a>
      <span class="btn btn-ghost" aria-disabled="true" title="Próximamente">
        App móvil — próximamente
      </span>
    </div>
    <p class="note">
      Requiere licencia válida.
      <a href="https://github.com/HydrosphereEnnde/Hydrosphere-Distribution/releases">Todas las versiones</a>
    </p>
  </main>
</body>
</html>
